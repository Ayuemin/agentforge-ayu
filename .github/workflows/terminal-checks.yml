name: Termux terminal app checks

on:
  push:
    branches:
      - work/termux-terminal-app
  pull_request:
    branches:
      - main

jobs:
  terminal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify Python syntax
        run: python -m compileall -q src/contentforge
      - name: Unit tests
        run: pytest -q tests/unit/test_terminal_app.py tests/unit/test_android_profile.py tests/unit/test_model_comparison_profiles.py
