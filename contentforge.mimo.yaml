# Controlled comparison profile for Android / Termux + Ubuntu.
# Set OPENROUTER_API_KEY in your shell. No secrets are stored in this file.
llm:
  provider: openrouter
  model: xiaomi/mimo-v2.5-pro
  omit_max_tokens: true
  temperature: 0.7
  top_p: 0.9

pipeline:
  target_word_count: 1500
  language: ru
  output_format: markdown
  seo_enabled: true
  quality_threshold: 0.8
  max_iterations: 3
  enable_translation: false

# No agents overrides: every active agent, including every Editor retry,
# inherits the same model from llm.model.
agents: []

output_dir: ./output
